name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  release:
    name: Test, sign and publish Windows packages
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "No se pudo instalar o localizar Inno Setup 6."
          }

      - name: Restore, build and test
        shell: pwsh
        run: |
          dotnet restore RadioEmisoraRD/RadioEmisoraRD.slnx
          dotnet restore RadioEmisoraRD/RadioEmisoraRD/RadioEmisoraRD.csproj --runtime win-x64
          dotnet build RadioEmisoraRD/RadioEmisoraRD.slnx --configuration Release --no-restore --warnaserror
          dotnet test RadioEmisoraRD/RadioEmisoraRD.slnx --configuration Release --no-build

      - name: Publish Windows builds
        shell: pwsh
        run: |
          dotnet publish RadioEmisoraRD/RadioEmisoraRD/RadioEmisoraRD.csproj --configuration Release --no-restore --property:PublishProfile=Portable --output artifacts/portable
          dotnet publish RadioEmisoraRD/RadioEmisoraRD/RadioEmisoraRD.csproj --configuration Release --no-restore --property:PublishProfile=SelfContained --output artifacts/self-contained
          Copy-Item packaging/portable.flag artifacts/portable/portable.flag

      - name: Prepare Authenticode certificate
        id: signing
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64)) {
            Write-Warning "WINDOWS_SIGNING_CERT_BASE64 no está configurado. Los artefactos se publicarán sin firma Authenticode."
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "RadioEmisoraRD-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64)
          )
          "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "certificate_path=$certificatePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Sign application executables
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          ./packaging/Sign-WindowsArtifacts.ps1 `
            -CertificatePath "${{ steps.signing.outputs.certificate_path }}" `
            -Password $env:WINDOWS_SIGNING_CERT_PASSWORD `
            -Paths @(
              "artifacts/portable/RadioEmisoraRD.exe",
              "artifacts/self-contained/RadioEmisoraRD.exe"
            )

      - name: Build archives and installer
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/portable/* -DestinationPath artifacts/RadioEmisoraRD-portable.zip
          Compress-Archive -Path artifacts/self-contained/* -DestinationPath artifacts/RadioEmisoraRD-win-x64.zip

          [xml]$project = Get-Content RadioEmisoraRD/RadioEmisoraRD/RadioEmisoraRD.csproj
          $version = [string](($project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version)
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart('v')
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "No se pudo determinar la versión del instalador."
          }

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$version" "packaging/RadioEmisoraRD.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "La compilación del instalador falló."
          }

          if (-not (Test-Path artifacts/RadioEmisoraRD-Setup-win-x64.exe)) {
            throw "El instalador esperado no fue generado."
          }

      - name: Sign installer
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          ./packaging/Sign-WindowsArtifacts.ps1 `
            -CertificatePath "${{ steps.signing.outputs.certificate_path }}" `
            -Password $env:WINDOWS_SIGNING_CERT_PASSWORD `
            -Paths @("artifacts/RadioEmisoraRD-Setup-win-x64.exe")

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(
            "RadioEmisoraRD-portable.zip",
            "RadioEmisoraRD-win-x64.zip",
            "RadioEmisoraRD-Setup-win-x64.exe"
          )
          Remove-Item artifacts/SHA256SUMS.txt -ErrorAction SilentlyContinue
          foreach ($file in $files) {
            $hash = (Get-FileHash "artifacts/$file" -Algorithm SHA256).Hash.ToLowerInvariant()
            "${hash}  ${file}" | Add-Content artifacts/SHA256SUMS.txt
          }

      - name: Remove temporary signing certificate
        if: always() && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: Remove-Item -LiteralPath "${{ steps.signing.outputs.certificate_path }}" -Force -ErrorAction SilentlyContinue

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: RadioEmisoraRD-release
          path: |
            artifacts/RadioEmisoraRD-portable.zip
            artifacts/RadioEmisoraRD-win-x64.zip
            artifacts/RadioEmisoraRD-Setup-win-x64.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          artifacts/RadioEmisoraRD-portable.zip
          artifacts/RadioEmisoraRD-win-x64.zip
          artifacts/RadioEmisoraRD-Setup-win-x64.exe
          artifacts/SHA256SUMS.txt
          --verify-tag
          --title "RadioEmisora RD ${{ github.ref_name }}"
          --notes-file RELEASE_NOTES.md
