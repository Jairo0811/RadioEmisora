name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  release:
    name: Test and publish Windows packages
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore, build and test
        shell: pwsh
        run: |
          dotnet restore RadioEmisoraRD/RadioEmisoraRD.slnx
          dotnet restore RadioEmisoraRD/RadioEmisoraRD/RadioEmisoraRD.csproj --runtime win-x64
          dotnet build RadioEmisoraRD/RadioEmisoraRD.slnx --configuration Release --no-restore --warnaserror
          dotnet test RadioEmisoraRD/RadioEmisoraRD.slnx --configuration Release --no-build

      - name: Publish packages
        shell: pwsh
        run: |
          dotnet publish RadioEmisoraRD/RadioEmisoraRD/RadioEmisoraRD.csproj --configuration Release --no-restore --property:PublishProfile=Portable --output artifacts/portable
          dotnet publish RadioEmisoraRD/RadioEmisoraRD/RadioEmisoraRD.csproj --configuration Release --no-restore --property:PublishProfile=SelfContained --output artifacts/self-contained
          Copy-Item packaging/portable.flag artifacts/portable/portable.flag
          Compress-Archive -Path artifacts/portable/* -DestinationPath artifacts/RadioEmisoraRD-portable.zip
          Compress-Archive -Path artifacts/self-contained/* -DestinationPath artifacts/RadioEmisoraRD-win-x64.zip
          $portableHash = (Get-FileHash artifacts/RadioEmisoraRD-portable.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $selfContainedHash = (Get-FileHash artifacts/RadioEmisoraRD-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "${portableHash}  RadioEmisoraRD-portable.zip" | Set-Content artifacts/SHA256SUMS.txt
          "${selfContainedHash}  RadioEmisoraRD-win-x64.zip" | Add-Content artifacts/SHA256SUMS.txt

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: RadioEmisoraRD-release
          path: |
            artifacts/RadioEmisoraRD-portable.zip
            artifacts/RadioEmisoraRD-win-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          artifacts/RadioEmisoraRD-portable.zip
          artifacts/RadioEmisoraRD-win-x64.zip
          artifacts/SHA256SUMS.txt
          --verify-tag
          --title "RadioEmisora RD ${{ github.ref_name }}"
          --notes-file RELEASE_NOTES.md
