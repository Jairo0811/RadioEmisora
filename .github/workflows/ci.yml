name: CI

on:
  push:
    branches: [master, "agent/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  validate:
    name: Build, test and package
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: RadioEmisoraRD/RadioEmisoraRD.Tests/RadioEmisoraRD.Tests.csproj

      - name: Setup Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "No se pudo instalar o localizar Inno Setup 6."
          }

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore RadioEmisoraRD/RadioEmisoraRD.slnx
          dotnet restore RadioEmisoraRD/RadioEmisoraRD/RadioEmisoraRD.csproj --runtime win-x64

      - name: Build Release
        run: dotnet build RadioEmisoraRD/RadioEmisoraRD.slnx --configuration Release --no-restore --warnaserror

      - name: Run tests
        run: dotnet test RadioEmisoraRD/RadioEmisoraRD.slnx --configuration Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Publish portable build
        run: dotnet publish RadioEmisoraRD/RadioEmisoraRD/RadioEmisoraRD.csproj --configuration Release --no-restore --property:PublishProfile=Portable --output artifacts/portable

      - name: Publish self-contained build
        run: dotnet publish RadioEmisoraRD/RadioEmisoraRD/RadioEmisoraRD.csproj --configuration Release --no-restore --property:PublishProfile=SelfContained --output artifacts/self-contained

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "packaging/RadioEmisoraRD.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "La compilación del instalador falló."
          }
          if (-not (Test-Path artifacts/RadioEmisoraRD-Setup-win-x64.exe)) {
            throw "El instalador esperado no fue generado."
          }

      - name: Generate real portfolio media
        run: dotnet run --project RadioEmisoraRD/RadioEmisoraRD/RadioEmisoraRD.csproj --configuration Release --no-build -- --capture-docs "$PWD/artifacts/portfolio-media"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn
          retention-days: 14

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: RadioEmisoraRD-portable
          path: artifacts/portable
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: RadioEmisoraRD-installer
          path: artifacts/RadioEmisoraRD-Setup-win-x64.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload portfolio media
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-media
          path: artifacts/portfolio-media
          if-no-files-found: error
          retention-days: 14
